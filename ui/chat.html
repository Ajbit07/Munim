<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Munim · Paytm Business</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect x='7' y='5' width='27' height='31' rx='3' fill='%23C8102E'/><rect x='7' y='5' width='5' height='31' rx='2' fill='%238E0B20'/><rect x='14.5' y='9' width='16' height='23' rx='1.5' fill='%23FFF6F7'/><path d='M17.5 21l3 3 6-7' stroke='%230F7B55' stroke-width='2.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/ui/chat.css">
</head>
<body>
  <main class="phone" aria-label="Merchant chat">
    <header class="bar">
      <a class="back" href="/" title="Back to the command center" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <span class="bot-avatar" aria-hidden="true"><svg  viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="5" width="27" height="31" rx="3" fill="#C8102E"/><rect x="7" y="5" width="5" height="31" rx="2" fill="#8E0B20"/><path d="M9.5 8v25" stroke="#F4C7CE" stroke-width="1" stroke-dasharray="2 2"/><rect x="14.5" y="9" width="16" height="23" rx="1.5" fill="#FFF6F7"/><path d="M17.5 21l3 3 6-7" stroke="#0F7B55" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 16h3" stroke="#00BAF2" stroke-width="2.4" stroke-linecap="round"/></svg></span>
      <div class="bar-text">
        <strong>Munim <span class="deva" lang="hi">मुनीम</span></strong>
        <span id="engine">Connecting…</span>
      </div>
      <label class="lang" title="Reply language">
        <span class="sr">Reply language</span>
        <select id="language">
          <option value="auto">Auto</option>
        </select>
      </label>
    </header>

    <div class="banner" id="banner" hidden></div>

    <section class="thread" id="thread" aria-live="polite"></section>

    <div class="chips" id="chips"></div>

    <form class="composer" id="composer" autocomplete="off">
      <button type="button" id="mic" class="mic" aria-label="Speak your question" title="Tap and speak; tap again to send">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M8.5 21h7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <input id="input" type="text" maxlength="500" placeholder="Likhiye ya bol kar poochiye… (any language)" aria-label="Message">
      <button type="submit" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z" fill="currentColor"/></svg>
      </button>
    </form>
    <p class="fineprint">Answers come from your own settlement records. Paytm never asks for your OTP, PIN or password.</p>
  </main>
  <script src="/ui/chat.js"></script>
</body>
</html>
