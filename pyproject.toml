[project]
name = "mfp"
version = "0.1.0"
description = "Munim - Paytm's autonomous settlement teammate: finds, proves and corrects settlement errors"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
memory = ["cognee"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]
addopts = "-q"
